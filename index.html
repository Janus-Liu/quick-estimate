<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>概估計算機 — L2 室內裝修工程估價</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.9/babel.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f1923;
    color: #e8e0d5;
    min-height: 100vh;
  }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const CASE_TYPES = [
  { id: 'full', label: '全室翻新', desc: '全屋拆除重做' },
  { id: 'partial', label: '局部翻新', desc: '浴室全換、廚房改造、主臥重做' },
  { id: 'light', label: '輕裝修', desc: '油漆、地板、燈具、局部木作' },
  { id: 'new', label: '新成屋客變', desc: '格局調整、廚浴升級' },
];

// 每坪萬元
const BASE_RATES = {
  full:    { basic: [8, 12],   mid: [12, 18],  high: [18, 28] },
  partial: { basic: [5, 8],    mid: [8, 14],   high: [14, 25] },
  light:   { basic: [2, 4],    mid: [4, 7],    high: [7, 12]  },
  new:     { basic: [4, 7],    mid: [7, 12],   high: [12, 20] },
};

const GRADE_LABELS = { basic: '基本', mid: '中等', high: '高規' };

// 工種佔比（依案型變化）
const TRADE_RATIOS = {
  full: [
    { name: '拆除清運', pct: 8 },
    { name: '水電工程', pct: 18 },
    { name: '泥作工程', pct: 15 },
    { name: '防水工程', pct: 5 },
    { name: '磁磚工程', pct: 12 },
    { name: '木作工程', pct: 20 },
    { name: '油漆工程', pct: 8 },
    { name: '設備安裝', pct: 6 },
    { name: '天花板',   pct: 5 },
    { name: '收邊雜項', pct: 3 },
  ],
  partial: [
    { name: '拆除清運', pct: 6 },
    { name: '水電工程', pct: 16 },
    { name: '泥作工程', pct: 14 },
    { name: '防水工程', pct: 8 },
    { name: '磁磚工程', pct: 15 },
    { name: '木作工程', pct: 15 },
    { name: '油漆工程', pct: 6 },
    { name: '設備安裝', pct: 12 },
    { name: '天花板',   pct: 5 },
    { name: '收邊雜項', pct: 3 },
  ],
  light: [
    { name: '油漆工程', pct: 25 },
    { name: '木作工程', pct: 25 },
    { name: '水電工程', pct: 15 },
    { name: '天花板',   pct: 15 },
    { name: '地板工程', pct: 12 },
    { name: '收邊雜項', pct: 8 },
  ],
  new: [
    { name: '水電工程', pct: 20 },
    { name: '木作工程', pct: 22 },
    { name: '泥作工程', pct: 10 },
    { name: '磁磚工程', pct: 12 },
    { name: '設備安裝', pct: 10 },
    { name: '天花板',   pct: 10 },
    { name: '油漆工程', pct: 8 },
    { name: '防水工程', pct: 5 },
    { name: '收邊雜項', pct: 3 },
  ],
};

const AGE_OPTIONS = [
  { id: 'new',  label: '10年以下', factor: 1.0,  desc: '' },
  { id: 'mid',  label: '10–20年',  factor: 1.10, desc: '+10%' },
  { id: 'old',  label: '20–30年',  factor: 1.20, desc: '+20%' },
  { id: 'aged', label: '30年以上', factor: 1.35, desc: '+35%' },
];

const LAYOUT_OPTIONS = [
  { id: 'none',    label: '不動格局',   factor: 1.0,  desc: '' },
  { id: 'minor',   label: '局部微調',   factor: 1.08, desc: '+8%' },
  { id: 'partial', label: '部分拆建',   factor: 1.18, desc: '+18%' },
  { id: 'major',   label: '大幅異動',   factor: 1.30, desc: '+30%' },
];

function QuickEstimate() {
  const [caseType, setCaseType] = useState('full');
  const [grade, setGrade] = useState('mid');
  const [area, setArea] = useState('');
  const [age, setAge] = useState('new');
  const [layout, setLayout] = useState('none');
  const [windowCount, setWindowCount] = useState('');
  const [noElevator, setNoElevator] = useState(false);
  const [importMat, setImportMat] = useState(false);

  const calcResult = () => {
    const a = parseFloat(area);
    if (!a || a <= 0) return null;
    const [lo, hi] = BASE_RATES[caseType][grade];

    const ageFactor = AGE_OPTIONS.find(o => o.id === age).factor;
    const layoutFactor = LAYOUT_OPTIONS.find(o => o.id === layout).factor;
    const elevatorFactor = noElevator ? 1.05 : 1.0;
    const importFactor = importMat ? 1.20 : 1.0;
    const factor = ageFactor * layoutFactor * elevatorFactor * importFactor;

    const wc = parseInt(windowCount) || 0;
    const windowCost = wc * 2.5; // 每扇窗約2.5萬

    const baseLow = lo * a * factor + windowCost;
    const baseHigh = hi * a * factor + windowCost;

    // 加成明細
    const adjustments = [];
    if (age !== 'new') adjustments.push({ label: `屋齡加成（${AGE_OPTIONS.find(o=>o.id===age).label}）`, desc: AGE_OPTIONS.find(o=>o.id===age).desc });
    if (layout !== 'none') adjustments.push({ label: `格局異動（${LAYOUT_OPTIONS.find(o=>o.id===layout).label}）`, desc: LAYOUT_OPTIONS.find(o=>o.id===layout).desc });
    if (noElevator) adjustments.push({ label: '高樓層無電梯', desc: '+5%' });
    if (importMat) adjustments.push({ label: '指定進口建材', desc: '+20%' });
    if (wc > 0) adjustments.push({ label: `換窗 ${wc} 扇`, desc: `約 ${Math.round(windowCost)} 萬` });

    // 工種分佈
    const trades = TRADE_RATIOS[caseType];
    const tradeBaseLow = baseLow - windowCost; // 換窗不算進工種分佈
    const tradeBaseHigh = baseHigh - windowCost;
    const tradeBreakdown = trades.map(t => ({
      name: t.name,
      pct: t.pct,
      min: Math.round(tradeBaseLow * t.pct / 100),
      max: Math.round(tradeBaseHigh * t.pct / 100),
    }));

    return {
      low: Math.round(baseLow),
      high: Math.round(baseHigh),
      perPing: [Math.round(baseLow / a), Math.round(baseHigh / a)],
      adjustments,
      tradeBreakdown,
    };
  };

  const result = calcResult();
  const fmt = (n) => n.toLocaleString();
  const formatRange = (min, max) => {
    if (min >= 100) return `${min}–${max} 萬`;
    if (min >= 10) return `${min}–${max} 萬`;
    return `${min.toFixed(1)}–${max.toFixed(1)} 萬`;
  };

  const btnStyle = (active) => ({
    padding: '10px 0', borderRadius: 8, flex: 1, textAlign: 'center',
    border: `1px solid ${active ? '#b49664' : 'rgba(180,150,100,0.2)'}`,
    background: active ? 'rgba(180,150,100,0.15)' : 'transparent',
    color: active ? '#b49664' : 'rgba(232,224,213,0.5)',
    fontSize: 12, cursor: 'pointer', transition: 'all 0.15s',
  });

  const pillStyle = (active) => ({
    padding: '7px 14px', borderRadius: 16,
    border: `1px solid ${active ? '#b49664' : 'rgba(180,150,100,0.2)'}`,
    background: active ? 'rgba(180,150,100,0.15)' : 'transparent',
    color: active ? '#b49664' : 'rgba(232,224,213,0.5)',
    fontSize: 12, cursor: 'pointer', transition: 'all 0.15s',
  });

  const labelStyle = { display: 'block', fontSize: 11, color: '#b49664', marginBottom: 10, letterSpacing: 1, textTransform: 'uppercase' };

  return (
    <div style={{ maxWidth: 720, margin: '0 auto', padding: '40px 20px' }}>
      <div style={{ marginBottom: 40 }}>
        <div style={{ fontSize: 10, color: 'rgba(180,150,100,0.5)', letterSpacing: 3, marginBottom: 8, textTransform: 'uppercase' }}>L2 室內裝修</div>
        <h1 style={{ fontSize: 24, fontWeight: 400, color: '#b49664', marginBottom: 8 }}>概估計算機</h1>
        <p style={{ fontSize: 13, color: 'rgba(232,224,213,0.4)', lineHeight: 1.6 }}>快速估算裝修費用區間，用於與客人初步溝通預算</p>
      </div>

      {/* 裝修類型 */}
      <div style={{ marginBottom: 24 }}>
        <label style={labelStyle}>裝修類型</label>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(140px, 1fr))', gap: 8 }}>
          {CASE_TYPES.map(ct => (
            <button key={ct.id} onClick={() => setCaseType(ct.id)} style={{
              padding: '14px 10px', borderRadius: 10, textAlign: 'center',
              border: `1px solid ${caseType === ct.id ? '#b49664' : 'rgba(180,150,100,0.2)'}`,
              background: caseType === ct.id ? 'rgba(180,150,100,0.12)' : 'transparent',
              color: caseType === ct.id ? '#b49664' : 'rgba(232,224,213,0.5)',
              cursor: 'pointer', transition: 'all 0.15s',
            }}>
              <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 4 }}>{ct.label}</div>
              <div style={{ fontSize: 10, color: 'rgba(232,224,213,0.35)', lineHeight: 1.4 }}>{ct.desc}</div>
            </button>
          ))}
        </div>
      </div>

      {/* 等級 + 坪數 */}
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20, marginBottom: 24 }}>
        <div>
          <label style={labelStyle}>裝修等級</label>
          <div style={{ display: 'flex', gap: 8 }}>
            {Object.entries(GRADE_LABELS).map(([k, v]) => (
              <button key={k} onClick={() => setGrade(k)} style={btnStyle(grade === k)}>{v}</button>
            ))}
          </div>
        </div>
        <div>
          <label style={labelStyle}>室內坪數</label>
          <input type="number" value={area} onChange={e => setArea(e.target.value)}
            placeholder="請輸入坪數"
            style={{ width: '100%', boxSizing: 'border-box', padding: '10px 14px', background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(180,150,100,0.2)', borderRadius: 8, color: '#e8e0d5', fontSize: 14, outline: 'none' }} />
        </div>
      </div>

      {/* 屋齡 */}
      <div style={{ marginBottom: 24 }}>
        <label style={labelStyle}>屋齡</label>
        <div style={{ display: 'flex', gap: 8 }}>
          {AGE_OPTIONS.map(o => (
            <button key={o.id} onClick={() => setAge(o.id)} style={btnStyle(age === o.id)}>
              <div style={{ fontSize: 12 }}>{o.label}</div>
              {o.desc && <div style={{ fontSize: 10, color: 'rgba(180,150,100,0.5)', marginTop: 2 }}>{o.desc}</div>}
            </button>
          ))}
        </div>
      </div>

      {/* 格局異動 */}
      <div style={{ marginBottom: 24 }}>
        <label style={labelStyle}>格局異動程度</label>
        <div style={{ display: 'flex', gap: 8 }}>
          {LAYOUT_OPTIONS.map(o => (
            <button key={o.id} onClick={() => setLayout(o.id)} style={btnStyle(layout === o.id)}>
              <div style={{ fontSize: 12 }}>{o.label}</div>
              {o.desc && <div style={{ fontSize: 10, color: 'rgba(180,150,100,0.5)', marginTop: 2 }}>{o.desc}</div>}
            </button>
          ))}
        </div>
      </div>

      {/* 換窗 + 其他加成 */}
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20, marginBottom: 32 }}>
        <div>
          <label style={labelStyle}>換窗數量（選填）</label>
          <input type="number" value={windowCount} onChange={e => setWindowCount(e.target.value)}
            placeholder="幾扇窗？"
            style={{ width: '100%', boxSizing: 'border-box', padding: '10px 14px', background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(180,150,100,0.2)', borderRadius: 8, color: '#e8e0d5', fontSize: 14, outline: 'none' }} />
          <div style={{ fontSize: 10, color: 'rgba(232,224,213,0.25)', marginTop: 4 }}>每扇約 2.5 萬（含工帶料）</div>
        </div>
        <div>
          <label style={labelStyle}>其他條件</label>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            <button onClick={() => setNoElevator(!noElevator)} style={pillStyle(noElevator)}>
              {noElevator ? '✓ ' : ''}高樓層無電梯
              <span style={{ fontSize: 10, marginLeft: 4, color: 'rgba(232,224,213,0.3)' }}>搬運加成 +5%</span>
            </button>
            <button onClick={() => setImportMat(!importMat)} style={pillStyle(importMat)}>
              {importMat ? '✓ ' : ''}指定進口建材
              <span style={{ fontSize: 10, marginLeft: 4, color: 'rgba(232,224,213,0.3)' }}>建材加成 +20%</span>
            </button>
          </div>
        </div>
      </div>

      {/* 結果 */}
      {result ? (
        <div style={{ borderRadius: 16, overflow: 'hidden', border: '1px solid rgba(180,150,100,0.25)' }}>
          {/* 總價 */}
          <div style={{ padding: 28, background: 'rgba(180,150,100,0.08)' }}>
            <div style={{ fontSize: 11, color: 'rgba(232,224,213,0.4)', letterSpacing: 1, marginBottom: 16, textTransform: 'uppercase' }}>概估費用區間</div>
            <div style={{ fontSize: 36, fontWeight: 700, color: '#b49664', marginBottom: 8 }}>
              {fmt(result.low)}–{fmt(result.high)} <span style={{ fontSize: 16, fontWeight: 400 }}>萬元</span>
            </div>
            <div style={{ fontSize: 13, color: 'rgba(232,224,213,0.5)' }}>
              每坪造價約 {fmt(result.perPing[0])}–{fmt(result.perPing[1])} 萬元
            </div>

            {/* 加成明細 */}
            {result.adjustments.length > 0 && (
              <div style={{ marginTop: 16, paddingTop: 12, borderTop: '1px solid rgba(180,150,100,0.15)' }}>
                <div style={{ fontSize: 10, color: 'rgba(232,224,213,0.3)', marginBottom: 8 }}>加成明細</div>
                {result.adjustments.map((adj, i) => (
                  <div key={i} style={{ display: 'flex', justifyContent: 'space-between', fontSize: 11, color: 'rgba(232,224,213,0.45)', marginBottom: 4 }}>
                    <span>{adj.label}</span>
                    <span style={{ color: '#b49664' }}>{adj.desc}</span>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* 工種費用分佈 */}
          <div style={{ padding: '20px 28px', background: 'rgba(180,150,100,0.04)' }}>
            <div style={{ fontSize: 10, color: 'rgba(232,224,213,0.35)', letterSpacing: 1, marginBottom: 14, textTransform: 'uppercase' }}>
              工種費用分佈（基礎工程部分）
            </div>
            {result.tradeBreakdown.map((t, i) => (
              <div key={i} style={{ marginBottom: 11 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 4 }}>
                  <span style={{ fontSize: 12, color: 'rgba(232,224,213,0.55)' }}>{t.name}</span>
                  <span style={{ fontSize: 12, color: 'rgba(232,224,213,0.4)' }}>{formatRange(t.min, t.max)}</span>
                </div>
                <div style={{ height: 3, background: 'rgba(255,255,255,0.05)', borderRadius: 2 }}>
                  <div style={{
                    height: '100%', borderRadius: 2,
                    background: 'linear-gradient(90deg, rgba(180,150,100,0.3), #b49664)',
                    width: `${t.pct}%`, transition: 'width 0.5s ease',
                  }} />
                </div>
              </div>
            ))}
          </div>

          {/* 提醒 */}
          <div style={{ padding: '14px 28px', background: 'rgba(0,0,0,0.2)', borderTop: '1px solid rgba(180,150,100,0.1)' }}>
            <p style={{ margin: 0, fontSize: 11, color: 'rgba(232,224,213,0.25)', lineHeight: 1.9 }}>
              ＊ 初期定位用途，不包含設計費、家具軟裝、系統家具。<br />
              ＊ 實際報價需依設計決策、材料選擇、工班行情調整。<br />
              ＊ 老屋建議額外保留 15–25% 預備金。
            </p>
          </div>
        </div>
      ) : (
        <div style={{ padding: 28, background: 'rgba(255,255,255,0.02)', border: '1px solid rgba(180,150,100,0.1)', borderRadius: 16, textAlign: 'center', color: 'rgba(232,224,213,0.2)', fontSize: 13 }}>
          輸入坪數後顯示概估結果
        </div>
      )}

      {/* 底部 */}
      <div style={{ marginTop: 40, paddingTop: 20, borderTop: '1px solid rgba(180,150,100,0.1)', textAlign: 'center' }}>
        <div style={{ fontSize: 10, color: 'rgba(232,224,213,0.2)', lineHeight: 1.8 }}>
          風間設計 Windsroom Interior Design<br />
          此工具僅供初步溝通參考，不構成正式報價
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<QuickEstimate />);
</script>
</body>
</html>
